<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ぽかぽか こうえんの かくれんぼ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for Cute Japanese Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            rounded: ['"M PLUS Rounded 1c"', '"Kiwi Maru"', 'sans-serif'],
          },
          colors: {
            warmBg: '#FFFDF7',
            warmCard: '#FFF9ED',
            warmBorder: '#F6E4C4',
            pastelAmber: '#F9A825',
            pastelGreen: '#81C784',
            pastelBrown: '#795548',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'M PLUS Rounded 1c', 'Kiwi Maru', sans-serif;
      background-color: #FFFDF7;
      background-image: radial-gradient(#F5E8D0 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      user-select: none;
      -webkit-user-select: none;
    }

    .story-card {
      box-shadow: 0 12px 32px rgba(212, 175, 126, 0.25);
    }

    .btn-bounce {
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s;
    }
    .btn-bounce:active {
      transform: scale(0.92);
    }
    .btn-bounce:hover {
      transform: translateY(-2px);
    }

    /* Active text line highlighting */
    .reading-highlight {
      background-color: #FEF3C7;
      border-radius: 8px;
      padding: 2px 8px;
      box-shadow: 0 0 0 2px #FDE68A;
      transition: all 0.3s ease;
    }

    /* Smooth page transitions */
    .page-fade {
      animation: fadeIn 0.4s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-amber-950 p-3 md:p-6 overflow-x-hidden">

  <!-- TOP HEADER / CONTROL BAR -->
  <header class="max-w-4xl w-full mx-auto flex flex-wrap items-center justify-between gap-2 pb-3 border-b-2 border-amber-200/60">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🌸</span>
      <h1 class="text-lg md:text-xl font-bold text-amber-900 tracking-wide">ぽかぽか こうえんの かくれんぼ</h1>
    </div>

    <!-- AUDIO CONTROLS -->
    <div class="flex items-center gap-2 flex-wrap text-sm">
      <button id="bgmToggle" onclick="toggleBGM()" class="btn-bounce bg-amber-100 hover:bg-amber-200 text-amber-900 px-3 py-1.5 rounded-full font-bold flex items-center gap-1 border border-amber-300">
        <span id="bgmIcon">🎵</span> <span id="bgmText">BGM: OFF</span>
      </button>

      <button id="autoReadToggle" onclick="toggleAutoTurn()" class="btn-bounce bg-emerald-100 hover:bg-emerald-200 text-emerald-900 px-3 py-1.5 rounded-full font-bold flex items-center gap-1 border border-emerald-300">
        <span id="autoReadIcon">🔄</span> <span id="autoReadText">じどうめくり: OFF</span>
      </button>

      <button onclick="readCurrentPage()" class="btn-bounce bg-orange-100 hover:bg-orange-200 text-orange-900 px-3 py-1.5 rounded-full font-bold flex items-center gap-1 border border-orange-300">
        🔊 よみあげ
      </button>
    </div>
  </header>

  <!-- MAIN STORY APP CONTAINER -->
  <main class="max-w-4xl w-full mx-auto my-auto py-4 flex-grow flex flex-col justify-center items-center">
    
    <div class="story-card w-full bg-warmCard rounded-3xl border-4 border-warmBorder p-4 md:p-8 flex flex-col items-center relative overflow-hidden">
      
      <!-- PAGE CONTENT AREA -->
      <div id="pageContainer" class="w-full flex flex-col items-center page-fade">
        
        <!-- MEDIA CONTAINER (IMAGE / GIF / FALLBACK CANVAS) -->
        <div class="w-full max-w-2xl aspect-[4/3] rounded-2xl overflow-hidden border-2 border-amber-200/80 bg-orange-50/50 shadow-inner flex items-center justify-center relative mb-6">
          <img id="pageImg" src="" alt="絵本イラスト" class="w-full h-full object-contain hidden" />
          <canvas id="fallbackCanvas" class="w-full h-full object-contain hidden"></canvas>

          <!-- Loading indicator -->
          <div id="imageLoader" class="absolute inset-0 flex items-center justify-center bg-amber-50/80 backdrop-blur-sm">
            <div class="flex flex-col items-center gap-2">
              <div class="w-8 h-8 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
              <span class="text-xs text-amber-800 font-bold">よみこみちゅう...</span>
            </div>
          </div>
        </div>

        <!-- STORY TEXT BOX -->
        <div id="textbox" class="w-full max-w-2xl bg-white/90 rounded-2xl p-4 md:p-6 border-2 border-amber-200 shadow-sm text-center min-h-[140px] flex flex-col justify-center items-center">
          <!-- Sentences inserted dynamically via JS -->
        </div>

        <!-- SOUND EFFECT / INTERACTIVE BUTTONS FOR PAGE ONOMATOPOEIA -->
        <div id="soundButtonsContainer" class="mt-4 flex flex-wrap justify-center gap-2 min-h-[36px]">
          <!-- Interactive sound buttons injected here -->
        </div>

      </div>

    </div>

  </main>

  <!-- BOTTOM NAVIGATION & PAGE DOTS -->
  <footer class="max-w-4xl w-full mx-auto pt-2 flex flex-col items-center gap-3">
    
    <!-- PAGE DOTS -->
    <div id="pageDots" class="flex items-center gap-2">
      <!-- Dots generated dynamically -->
    </div>

    <!-- PREV / NEXT BUTTONS -->
    <div class="flex items-center justify-between w-full max-w-xs gap-4">
      <button id="prevBtn" onclick="changePage(-1)" class="btn-bounce flex-1 bg-amber-200 hover:bg-amber-300 text-amber-900 font-extrabold py-3 px-4 rounded-2xl border-2 border-amber-300 shadow-md text-lg flex items-center justify-center gap-1 disabled:opacity-30 disabled:pointer-events-none">
        👈 まえへ
      </button>
      
      <span id="pageIndicator" class="font-bold text-amber-800 text-sm whitespace-nowrap">
        0 / 9
      </span>

      <button id="nextBtn" onclick="changePage(1)" class="btn-bounce flex-1 bg-amber-400 hover:bg-amber-500 text-amber-950 font-extrabold py-3 px-4 rounded-2xl border-2 border-amber-400 shadow-md text-lg flex items-center justify-center gap-1 disabled:opacity-30 disabled:pointer-events-none">
        つぎへ 👉
      </button>
    </div>

    <!-- COLLAPSIBLE LOCAL FILE PREVIEWER (FOR TESTING LOCAL GIF FILES BEFORE GITHUB UPLOAD) -->
    <details class="w-full max-w-xl mt-4 text-xs text-amber-800/80 bg-amber-100/50 rounded-xl p-3 border border-amber-200">
      <summary class="cursor-pointer font-bold hover:text-amber-900 flex items-center justify-between">
        <span>🛠️ PC内のGIF・画像ファイルをローカルでテスト表示する</span>
        <span class="text-xxs text-amber-600">（クリックで開閉）</span>
      </summary>
      <div class="mt-2 flex flex-col gap-2 pt-2 border-t border-amber-200/60">
        <p>GitHubへアップロードする前に、お持ちの `title.gif` や `page1.gif` を指定して動くか確認できます。</p>
        <div class="flex items-center gap-2">
          <input type="file" id="localFilePicker" accept="image/*" class="text-xs border rounded p-1 bg-white" onchange="loadLocalFilePreview(event)">
          <button onclick="clearLocalOverride()" class="px-2 py-1 bg-amber-200 rounded text-amber-900 font-bold hover:bg-amber-300">リセット</button>
        </div>
      </div>
    </details>

  </footer>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    /* ===================================================================
       1. BOOK DATA (EXACT TEXT, SOUND EFFECTS, MEDIA FALLBACK FILE NAMES)
       =================================================================== */
    const STORY_PAGES = [
      {
        page: 0,
        filename: 'title',
        isTitlePage: true,
        textLines: [],
        sounds: []
      },
      {
        page: 1,
        filename: 'page1',
        textLines: [
          "ぽかぽか おひさま、いい てんき。",
          "みどりの はっぱが さらさら ゆれる、おおきな きの したに、",
          "みんなが にこにこ あつまったよ。"
        ],
        sounds: [
          { label: "🍃 さらさら", sfx: "sarasara" },
          { label: "☀️ ぽかぽか", sfx: "pokapoka" }
        ]
      },
      {
        page: 2,
        filename: 'page2',
        textLines: [
          "「ぴょんぴょん！ ぼく、うさぎの ぴょんた！」",
          "「ぶひぶひ！ ぼく、こぶたの ぶー！」",
          "「めぇ〜。わしは やぎの めぇじいじゃよ。みんな よろしくね」"
        ],
        sounds: [
          { label: "🐰 ぴょんぴょん！", sfx: "pyonpyon" },
          { label: "🐷 ぶひぶひ！", sfx: "buhibuhi" },
          { label: "🐐 めぇ〜", sfx: "meee" }
        ]
      },
      {
        page: 3,
        filename: 'page3',
        textLines: [
          "「みんなで かくれんぼを しよう！」",
          "めぇじいが おにに なって、おおきな きの みきで 目を つむるよ。",
          "「いーち、にーい、さーん…… もう いいかい？」"
        ],
        sounds: [
          { label: "🌳 かくれんぼ！", sfx: "kakurenbo" },
          { label: "⏰ いーち、にーい…", sfx: "count" }
        ]
      },
      {
        page: 4,
        filename: 'page4',
        textLines: [
          "「まあだだよ！」",
          "ぴょんたは おおきな おはなの うしろに かくれたよ。",
          "ながーい おみみが、ぴょこん！"
        ],
        sounds: [
          { label: "🌸 まあだだよ！", sfx: "maadadayo" },
          { label: "🐰 ぴょこん！", sfx: "pyokon" }
        ]
      },
      {
        page: 5,
        filename: 'page5',
        textLines: [
          "ぶーは まるい みどりの しげみの なかに、すっぽり。",
          "みつからないように、しーっ…… じっと してるよ。"
        ],
        sounds: [
          { label: "🌿 すっぽり", sfx: "suppori" },
          { label: "🤫 しーっ…", sfx: "shh" }
        ]
      },
      {
        page: 6,
        filename: 'page6',
        textLines: [
          "「もう いいよー！」「よーし、さがすぞー！」",
          "「みーつけた！ ぴょんたも ぶーも、みーつけた！」",
          "「わーい！」「きゃっきゃっ！」 みんなで おおわらい。"
        ],
        sounds: [
          { label: "🔍 みーつけた！", sfx: "mitsuketa" },
          { label: "🎉 わーい！きゃっきゃっ", sfx: "waai" }
        ]
      },
      {
        page: 7,
        filename: 'page7',
        textLines: [
          "たくさん あそんだ あとは、ふかふか シロツメクサの じゅうたんで ひとやすみ。",
          "そよかぜ そよそよ、おひさま ぽかぽか。",
          "「きもち いいね」「あったかいね」"
        ],
        sounds: [
          { label: "🌬️ そよそよ", sfx: "soyosoyo" },
          { label: "🍀 ふかふか", sfx: "fukafuka" }
        ]
      },
      {
        page: 8,
        filename: 'page8',
        textLines: [
          "おそらが やさしい オレンジいろに なってきたよ。",
          "おうちへ かえる じかんだね。",
          "「また あした あそぼうね！」「バイバーイ！」"
        ],
        sounds: [
          { label: "🌅 おゆうやけ", sfx: "sunset" },
          { label: "👋 バイバーイ！", sfx: "byebye" }
        ]
      },
      {
        page: 9,
        filename: 'end',
        isEndingPage: true,
        textLines: [],
        sounds: [
          { label: "👏 おしまい！", sfx: "waai" }
        ]
      }
    ];

    /* ===================================================================
       2. STATE VARIABLES & INITIALIZATION
       =================================================================== */
    let currentPageIndex = 0;
    let isAutoTurn = false;
    let isBgmPlaying = false;
    let speechSynth = window.speechSynthesis;
    let currentSpeechUtterance = null;
    let localFileOverrides = {}; // Temporary preview map from file input

    // Web Audio API Context
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    /* Initialize on DOM Ready */
    window.addEventListener('DOMContentLoaded', () => {
      renderPageDots();
      loadPage(0);
      setupKeyboardAndTouch();
    });

    /* ===================================================================
       3. INTELLIGENT EXTERNAL IMAGE LOADER WITH FALLBACKS
       =================================================================== */
    function loadPageImage(pageData) {
      const imgEl = document.getElementById('pageImg');
      const canvasEl = document.getElementById('fallbackCanvas');
      const loaderEl = document.getElementById('imageLoader');

      loaderEl.classList.remove('hidden');
      imgEl.classList.add('hidden');
      canvasEl.classList.add('hidden');

      // Check local user file input override first
      if (localFileOverrides[pageData.page]) {
        imgEl.src = localFileOverrides[pageData.page];
        imgEl.onload = () => {
          loaderEl.classList.add('hidden');
          imgEl.classList.remove('hidden');
        };
        return;
      }

      // Sequential path candidates (Root directory -> images/ subfolder -> .gif / .jpg / .png)
      const base = pageData.filename;
      const candidates = [
        `./${base}.gif`,
        `./${base}.jpg`,
        `./${base}.png`,
        `./images/${base}.gif`,
        `./images/${base}.jpg`,
        `./images/${base}.png`
      ];

      let candidateIndex = 0;

      function tryNextCandidate() {
        if (candidateIndex >= candidates.length) {
          // If no image files found, draw watercolor SVG canvas placeholder
          drawWatercolorFallback(pageData);
          loaderEl.classList.add('hidden');
          canvasEl.classList.remove('hidden');
          return;
        }

        const src = candidates[candidateIndex++];
        const tempImg = new Image();
        tempImg.onload = () => {
          imgEl.src = src;
          loaderEl.classList.add('hidden');
          imgEl.classList.remove('hidden');
        };
        tempImg.onerror = () => {
          tryNextCandidate();
        };
        tempImg.src = src;
      }

      tryNextCandidate();
    }

    /* Decorative Watercolor Fallback Canvas if image is not uploaded yet */
    function drawWatercolorFallback(pageData) {
      const canvas = document.getElementById('fallbackCanvas');
      canvas.width = 800;
      canvas.height = 600;
      const ctx = canvas.getContext('2d');

      // Warm background gradient
      const grad = ctx.createLinearGradient(0, 0, 0, 600);
      if (pageData.page === 8) { // Sunset
        grad.addColorStop(0, '#FFE0B2');
        grad.addColorStop(0.5, '#FFCC80');
        grad.addColorStop(1, '#FFB74D');
      } else {
        grad.addColorStop(0, '#FFF9C4');
        grad.addColorStop(0.5, '#FFF59D');
        grad.addColorStop(1, '#C8E6C9');
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 800, 600);

      // Sun / Soft Glow
      ctx.beginPath();
      ctx.arc(400, 180, 100, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 238, 88, 0.5)';
      ctx.fill();

      // Big Oak Tree Silhouette
      ctx.fillStyle = '#8D6E63';
      ctx.fillRect(370, 320, 60, 200);

      ctx.beginPath();
      ctx.arc(400, 280, 140, 0, Math.PI * 2);
      ctx.fillStyle = pageData.page === 8 ? '#81C784' : '#A5D6A7';
      ctx.fill();

      // Cute message on canvas
      ctx.fillStyle = '#5D4037';
      ctx.font = 'bold 28px "M PLUS Rounded 1c", sans-serif';
      ctx.textAlign = 'center';
      
      let titleText = `[ ${pageData.filename}.gif をローカル/GitHubに配置してください ]`;
      if (pageData.isTitlePage) titleText = "ぽかぽか こうえんの かくれんぼ";
      if (pageData.isEndingPage) titleText = "🌸 おしまい 🌸";
      
      ctx.fillText(titleText, 400, 520);
    }

    /* ===================================================================
       4. PAGE RENDERER
       =================================================================== */
    function loadPage(index) {
      if (index < 0 || index >= STORY_PAGES.length) return;

      // Stop speech
      if (speechSynth.speaking) {
        speechSynth.cancel();
      }

      currentPageIndex = index;
      const data = STORY_PAGES[index];

      // Fade animation trigger
      const pageContainer = document.getElementById('pageContainer');
      pageContainer.classList.remove('page-fade');
      void pageContainer.offsetWidth; // trigger reflow
      pageContainer.classList.add('page-fade');

      // Load Image / GIF
      loadPageImage(data);

      // Build Textbox Content
      const textbox = document.getElementById('textbox');
      textbox.innerHTML = '';

      if (data.isTitlePage) {
        // TITLE PAGE: Title and ▶ はじめる button ONLY
        textbox.innerHTML = `
          <div class="flex flex-col items-center gap-4 py-2">
            <h1 class="text-3xl md:text-4xl font-extrabold text-amber-900 tracking-wider">
              ぽかぽか こうえんの<br><span class="text-amber-600">かくれんぼ</span>
            </h1>
            <button onclick="changePage(1)" class="btn-bounce mt-2 bg-gradient-to-r from-amber-400 to-orange-400 hover:from-amber-500 hover:to-orange-500 text-white font-extrabold text-2xl px-10 py-4 rounded-full shadow-lg border-4 border-white flex items-center gap-2">
              ▶ はじめる
            </button>
          </div>
        `;
      } else if (data.isEndingPage) {
        // ENDING PAGE: おしまい and リトライ button
        textbox.innerHTML = `
          <div class="flex flex-col items-center gap-4 py-2">
            <h2 class="text-4xl font-extrabold text-amber-900 tracking-widest">
              おしまい
            </h2>
            <button onclick="changePage(0)" class="btn-bounce mt-2 bg-amber-400 hover:bg-amber-500 text-amber-950 font-extrabold text-xl px-8 py-3 rounded-full shadow-md border-2 border-amber-300">
              🔄 もういちど みる
            </button>
          </div>
        `;
      } else {
        // STANDARD STORY PAGE LINES
        data.textLines.forEach((line, idx) => {
          const p = document.createElement('p');
          p.id = `line-${idx}`;
          p.className = 'text-lg md:text-2xl font-bold text-amber-950 my-1 leading-relaxed text-center tracking-wide';
          p.innerText = line;
          textbox.appendChild(p);
        });
      }

      // Render Sound Effect Buttons
      const soundContainer = document.getElementById('soundButtonsContainer');
      soundContainer.innerHTML = '';
      if (data.sounds && data.sounds.length > 0) {
        data.sounds.forEach(item => {
          const btn = document.createElement('button');
          btn.className = 'btn-bounce bg-amber-100 hover:bg-amber-200 text-amber-900 text-sm md:text-base font-bold px-3 py-1.5 rounded-full border border-amber-300 shadow-sm flex items-center gap-1';
          btn.innerText = item.label;
          btn.onclick = () => playSFX(item.sfx);
          soundContainer.appendChild(btn);
        });
      }

      // Update Navigation Buttons & Indicators
      document.getElementById('pageIndicator').innerText = `${currentPageIndex} / ${STORY_PAGES.length - 1}`;
      document.getElementById('prevBtn').disabled = (currentPageIndex === 0);
      document.getElementById('nextBtn').disabled = (currentPageIndex === STORY_PAGES.length - 1);
      updatePageDots();

      // Read narration aloud automatically
      setTimeout(() => {
        readCurrentPage();
      }, 300);
    }

    function changePage(delta) {
      loadPage(currentPageIndex + delta);
    }

    function updatePageDots() {
      const container = document.getElementById('pageDots');
      container.querySelectorAll('.dot-item').forEach((dot, idx) => {
        if (idx === currentPageIndex) {
          dot.className = 'dot-item w-4 h-4 rounded-full bg-amber-500 transition-all duration-300 scale-110 shadow-sm';
        } else {
          dot.className = 'dot-item w-2.5 h-2.5 rounded-full bg-amber-200 transition-all duration-300 hover:bg-amber-300 cursor-pointer';
        }
      });
    }

    function renderPageDots() {
      const container = document.getElementById('pageDots');
      container.innerHTML = '';
      STORY_PAGES.forEach((_, idx) => {
        const dot = document.createElement('div');
        dot.className = 'dot-item';
        dot.onclick = () => loadPage(idx);
        container.appendChild(dot);
      });
    }

    /* ===================================================================
       5. NARRATION (WEB SPEECH API)
       =================================================================== */
    function readCurrentPage() {
      if (!('speechSynthesis' in window)) return;
      speechSynth.cancel();

      const data = STORY_PAGES[currentPageIndex];
      if (data.isTitlePage || data.isEndingPage || !data.textLines || data.textLines.length === 0) return;

      let lineIndex = 0;

      function readNextLine() {
        if (lineIndex >= data.textLines.length) {
          // Clear highlighters
          data.textLines.forEach((_, i) => {
            const el = document.getElementById(`line-${i}`);
            if (el) el.classList.remove('reading-highlight');
          });

          // If auto turn enabled, go to next page after 2 seconds
          if (isAutoTurn && currentPageIndex < STORY_PAGES.length - 1) {
            setTimeout(() => {
              if (isAutoTurn) changePage(1);
            }, 2000);
          }
          return;
        }

        // Highlight current line
        data.textLines.forEach((_, i) => {
          const el = document.getElementById(`line-${i}`);
          if (el) {
            if (i === lineIndex) el.classList.add('reading-highlight');
            else el.classList.remove('reading-highlight');
          }
        });

        const textToRead = data.textLines[lineIndex];
        currentSpeechUtterance = new SpeechSynthesisUtterance(textToRead);
        currentSpeechUtterance.lang = 'ja-JP';
        currentSpeechUtterance.rate = 0.85; // Toddler friendly slow rate
        currentSpeechUtterance.pitch = 1.1;  // Warm friendly pitch

        currentSpeechUtterance.onend = () => {
          lineIndex++;
          readNextLine();
        };

        currentSpeechUtterance.onerror = () => {
          lineIndex++;
          readNextLine();
        };

        speechSynth.speak(currentSpeechUtterance);
      }

      readNextLine();
    }

    function toggleAutoTurn() {
      isAutoTurn = !isAutoTurn;
      const text = document.getElementById('autoReadText');
      const icon = document.getElementById('autoReadIcon');
      if (isAutoTurn) {
        text.innerText = "じどうめくり: ON";
        icon.innerText = "⚡";
        readCurrentPage();
      } else {
        text.innerText = "じどうめくり: OFF";
        icon.innerText = "🔄";
      }
    }

    /* ===================================================================
       6. WEB AUDIO SYNTHESIZER (BGM & CUTE EFFECT SOUNDS)
       =================================================================== */
    let bgmInterval = null;

    function toggleBGM() {
      const ctx = getAudioContext();
      isBgmPlaying = !isBgmPlaying;

      const bgmText = document.getElementById('bgmText');
      const bgmIcon = document.getElementById('bgmIcon');

      if (isBgmPlaying) {
        bgmText.innerText = "BGM: ON";
        bgmIcon.innerText = "🎶";
        startBgmLoop();
      } else {
        bgmText.innerText = "BGM: OFF";
        bgmIcon.innerText = "🎵";
        stopBgmLoop();
      }
    }

    function startBgmLoop() {
      stopBgmLoop();
      const ctx = getAudioContext();
      
      // Soft Music Box pentatonic notes (C5, D5, E5, G5, A5, C6)
      const notes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
      let noteStep = 0;

      bgmInterval = setInterval(() => {
        if (!isBgmPlaying) return;
        const freq = notes[noteStep % notes.length];
        noteStep = (noteStep + Math.floor(Math.random() * 2) + 1);

        playMusicBoxNote(freq, 0.4);
      }, 700);
    }

    function stopBgmLoop() {
      if (bgmInterval) {
        clearInterval(bgmInterval);
        bgmInterval = null;
      }
    }

    function playMusicBoxNote(freq, duration) {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);

      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + duration);
    }

    /* SYNTHESIS FOR ONOMATOPOEIA SOUND EFFECTS */
    function playSFX(type) {
      const ctx = getAudioContext();

      switch (type) {
        case 'pyonpyon':
        case 'pyokon':
          // Cute Boing Sound
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(300, ctx.currentTime);
          osc1.frequency.exponentialRampToValueAtTime(700, ctx.currentTime + 0.2);
          gain1.gain.setValueAtTime(0.2, ctx.currentTime);
          gain1.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start();
          osc1.stop(ctx.currentTime + 0.25);
          break;

        case 'buhibuhi':
          // Low Wobbly Pig Sound
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sawtooth';
          osc2.frequency.setValueAtTime(140, ctx.currentTime);
          osc2.frequency.setValueAtTime(110, ctx.currentTime + 0.08);
          osc2.frequency.setValueAtTime(150, ctx.currentTime + 0.16);
          gain2.gain.setValueAtTime(0.15, ctx.currentTime);
          gain2.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start();
          osc2.stop(ctx.currentTime + 0.25);
          break;

        case 'meee':
          // Gentle Goat Bleat Tone
          const osc3 = ctx.createOscillator();
          const gain3 = ctx.createGain();
          osc3.type = 'triangle';
          osc3.frequency.setValueAtTime(350, ctx.currentTime);
          osc3.frequency.linearRampToValueAtTime(320, ctx.currentTime + 0.4);
          gain3.gain.setValueAtTime(0.2, ctx.currentTime);
          gain3.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc3.connect(gain3);
          gain3.connect(ctx.destination);
          osc3.start();
          osc3.stop(ctx.currentTime + 0.4);
          break;

        case 'waai':
        case 'mitsuketa':
          // Happy Arpeggio Chime
          [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
            setTimeout(() => playMusicBoxNote(f, 0.5), i * 80);
          });
          break;

        case 'sarasara':
        case 'soyosoyo':
        case 'shh':
          // Soft Breeze / White Noise Hush
          const bufferSize = ctx.sampleRate * 0.4;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 1000;
          const gainNoise = ctx.createGain();
          gainNoise.gain.setValueAtTime(0.1, ctx.currentTime);
          gainNoise.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          noise.connect(filter);
          filter.connect(gainNoise);
          gainNoise.connect(ctx.destination);
          noise.start();
          break;

        default:
          playMusicBoxNote(587.33, 0.3);
          break;
      }
    }

    /* ===================================================================
       7. KEYBOARD & TOUCH SWIPE NAVIGATION
       =================================================================== */
    function setupKeyboardAndTouch() {
      // Keyboard Left / Right Arrows
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ') {
          changePage(1);
        } else if (e.key === 'ArrowLeft') {
          changePage(-1);
        }
      });

      // Touch Swipe Gesture
      let touchStartX = 0;
      let touchEndX = 0;

      const card = document.querySelector('.story-card');
      card.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      card.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, { passive: true });

      function handleSwipe() {
        const threshold = 50;
        if (touchStartX - touchEndX > threshold) {
          changePage(1); // Swipe Left -> Next Page
        } else if (touchEndX - touchStartX > threshold) {
          changePage(-1); // Swipe Right -> Prev Page
        }
      }
    }

    /* ===================================================================
       8. LOCAL FILE PREVIEW HELPER (TEST GIFS LOCALLY BEFORE UPLOADING)
       =================================================================== */
    function loadLocalFilePreview(event) {
      const file = event.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      localFileOverrides[currentPageIndex] = url;
      loadPageImage(STORY_PAGES[currentPageIndex]);
    }

    function clearLocalOverride() {
      localFileOverrides = {};
      loadPageImage(STORY_PAGES[currentPageIndex]);
      document.getElementById('localFilePicker').value = '';
    }
  </script>
